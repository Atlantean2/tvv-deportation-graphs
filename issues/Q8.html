<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Deportation Graphs — Q8</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q8")</script></head><body><main id="issue"><h2 class="desk">Q8. Claims vs Counts</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-10-25-D2.webp" alt="Deportation claims vs counts: same period, different numbers" loading="lazy"><figcaption><span class="t">Chart D2 (week of Oct 25, 2026). Deportation claims vs counts: same period, different numbers</span><p>On deportations proper, MPI&#x27;s FOIA-based count (~980,000) roughly matches DHS&#x27;s own &#x27;over 985,000&#x27; statement, while Homeland Security Secretary Mullin announced 845,931 on Jul 17. The real gap is in &#x27;total departures&#x27;: DHS claims more than 3 million (about 1 million deportations plus about 2 million self-deportations of unauthorized immigrants), while MPI estimates 790,000 to 1.9 million departures of immigrants with at least a year of US residence, roughly half DHS&#x27;s self-departure figure. MPI notes DHS cannot directly measure self-departures because it does not record most land exits at the Mexico border. The two totals are not defined identically (MPI excludes border turnbacks and people here under a year), which is itself part of the controversy.</p><p>Sources: <a href="https://www.migrationpolicy.org/system/files/2026-10/mpi-deportations-fact-sheet-2026-final.pdf">MPI deportations fact sheet, Oct 2026 (PDF; footnote 8 for the DHS and Mullin figures)</a></p></figcaption></figure></main></body></html>
