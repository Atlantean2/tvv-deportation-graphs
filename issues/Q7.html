<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Deportation Graphs — Q7</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q7")</script></head><body><main id="issue"><h2 class="desk">Q7. Totals since 1990</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-10-25-D1.webp" alt="Total US deportations FY1990-FY2026: Trump 2 vs the record" loading="lazy"><figcaption><span class="t">Chart D1 (week of Oct 25, 2026). Total US deportations FY1990-FY2026: Trump 2 vs the record</span><p>First full outside estimate of second-term deportations (Migration Policy Institute fact sheet by Marc Rosenblum, Oct 2026): about 980,000 removals and returns from Jan 20, 2025 to Jul 31, 2026, or 620,000 annualized for FY2025 and a projected 660,000 for FY2026. That is 26% above the FY2021-24 average and 42% above FY2017-20, but only about a third of the FY2000 peak of 1.86 million (mostly voluntary returns rather than formal removals, per the DHS Yearbook) and well below the 1-million-a-year target. Same definitions throughout: removals plus returns, Title 42 expulsions excluded. Controversy: DHS itself has posted inconsistent totals (845,931 announced by Secretary Mullin on Jul 17, 2026 vs &#x27;over 985,000&#x27; as of Jul 12 in a DHS statement), and, per MPI, DHS&#x27;s statistics office released its last detailed monthly enforcement report in January 2025.</p><p>Sources: <a href="https://www.migrationpolicy.org/system/files/2026-10/mpi-deportations-fact-sheet-2026-final.pdf">MPI deportations fact sheet, Oct 2026 (PDF)</a> <a href="https://ohss.dhs.gov/topics/immigration/yearbook">DHS OHSS Yearbook of Immigration Statistics, Table 39</a></p></figcaption></figure></main></body></html>
