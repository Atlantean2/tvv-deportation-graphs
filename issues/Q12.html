<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Deportation Graphs — Q12</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q12")</script></head><body><main id="issue"><h2 class="desk">Q12. EU Returns</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-11-15-D8.webp" alt="EU returns hit a series high, but orders still outrun them nearly 3 to 1" loading="lazy"><figcaption><span class="t">Chart D8 (week of Nov 15, 2026). EU returns hit a series high, but orders still outrun them nearly 3 to 1</span><p>Quarterly Eurostat counts for the EU-27: non-EU citizens ordered to leave (gold) against those actually returned after such an order (blue, darker = forced returns), 2021-Q1 to 2026-Q2. Returns rose from 24,180 in 2021-Q1 to 39,445 in 2026-Q2 (+63%), with a record 42,340 in 2025-Q3. In the four quarters to 2026-Q2, 157,765 people were returned, +13% on the previous four quarters, while 462,710 orders were issued. The returned-to-ordered ratio climbed from 27% to 36%. Forced returns have barely moved (15,030 → 16,190 a quarter); the growth came from assisted and unassisted voluntary departures.</p><ul><li>Orders to leave peaked at 125,375 in 2025-Q2 and were 110,335 in 2026-Q2 (-12% from the peak).</li><li>Forced returns in 2026-Q2: 16,190 (41% of all returns).</li><li>Policy context this week: the EU and Nigeria concluded talks on a readmission agreement (X post: https://x.com/beyondB_DAG/status/2120584800834666603); the deal is reported at about €100 million. In Italy, organizers of a &#x27;remigration&#x27; citizens&#x27; bill rallied on Nov 14 saying more than 150,000 people signed it (https://x.com/RyanAFournier/status/2121717685092511876). Neither changes the data through June 2026.</li><li>The OECD&#x27;s International Migration Outlook 2026 (Nov 12) says EU returns doubled between 2021 and 2025 and have been &#x27;roughly stable since Q3 2025, at around 35,000 per quarter&#x27; (its Figure 1.18, a narrower series than the total shown here).</li></ul><p class="nt">Note: The ratio of returns to orders is a rough gauge, not a cohort rate: people returned in a quarter may have been ordered to leave in earlier quarters, and one person can receive more than one order. Eurostat rounds counts to the nearest 5. Some voluntary-return subtotals are confidential or missing for some quarters; totals are used in the ratio. Eurostat&#x27;s quarterly series begins in 2021 for the EU-27 aggregate.</p><p>Sources: <a href="https://ec.europa.eu/eurostat/databrowser/view/migr_eiord1/default/table">Eurostat migr_eiord1, third-country nationals ordered to leave, quarterly (updated Sep 30 2026)</a> <a href="https://ec.europa.eu/eurostat/databrowser/view/migr_eirtn1/default/table">Eurostat migr_eirtn1, third-country nationals returned following an order to leave, quarterly (updated Sep 30 2026)</a> <a href="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_eirtn1?format=JSON&amp;lang=EN&amp;geo=EU27_2020">Eurostat dissemination API (JSON) used for all four datasets</a> <a href="https://www.oecd.org/en/publications/international-migration-outlook-2026_a9eab36b-en.html">OECD International Migration Outlook 2026 (Nov 12 2026), Figure 1.18: third-country nationals returned from an EU country, 2021-2026</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-15-D9.webp" alt="France issues more deportation orders than any EU state, and carries out 1 in 7" loading="lazy"><figcaption><span class="t">Chart D9 (week of Nov 15, 2026). France issues more deportation orders than any EU state, and carries out 1 in 7</span><p>Non-EU citizens ordered to leave and returned in 2025, for the 15 EU member states issuing the most orders (Eurostat annual data, published Sep 2026). EU-wide, 486,705 people were ordered to leave and 156,000 were returned (32%). France alone issued 137,550 orders — 28% of the EU total — but returned 18,930 (14%). Germany issued far fewer orders (55,240) and returned more people (36,075, 65%). Spain (11%) and Portugal (5%) returned the smallest shares among the large issuers; Sweden (76%), Austria (72%) and Cyprus (70%) the largest.</p><ul><li>France&#x27;s 118,620 gap between orders and returns in 2025 is larger than the total number of orders issued by any other member state.</li><li>Germany returned about 1.9 times as many people as France while issuing 2.5 times fewer orders.</li><li>Low ratios can reflect policy (France issues an order — the OQTF — almost automatically after refusals), not only enforcement failure; high ratios can reflect fewer, better-targeted orders.</li><li>The OECD&#x27;s International Migration Outlook 2026 (Nov 12) puts EU returns at 139,000 in 2025, double 2021; the Eurostat &#x27;all destinations&#x27; total used here is higher, so the OECD figure likely counts a narrower set of returns (for example, only returns to non-EU countries).</li></ul><p class="nt">Note: Returns are counted by the member state carrying them out and include voluntary departures that were verified; people returned in 2025 may have been ordered to leave in earlier years. Eurostat rounds to the nearest 5. Switzerland (an associated Schengen state) is excluded.</p><p>Sources: <a href="https://ec.europa.eu/eurostat/databrowser/view/migr_eiord/default/table">Eurostat migr_eiord, ordered to leave, annual 2025</a> <a href="https://ec.europa.eu/eurostat/databrowser/view/migr_eirtn/default/table">Eurostat migr_eirtn, returned following an order to leave, annual 2025</a> <a href="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/migr_eirtn1?format=JSON&amp;lang=EN&amp;geo=EU27_2020">Eurostat dissemination API (JSON) used for all four datasets</a> <a href="https://www.oecd.org/en/publications/international-migration-outlook-2026_a9eab36b-en.html">OECD International Migration Outlook 2026 (Nov 12 2026), Figure 1.18: third-country nationals returned from an EU country, 2021-2026</a></p></figcaption></figure></main></body></html>
