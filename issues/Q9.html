<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Deportation Graphs — Q9</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q9")</script></head><body><main id="issue"><h2 class="desk">Q9. Interior Shift</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-10-25-D3.webp" alt="Who is being deported: more interior arrests, fewer convicts" loading="lazy"><figcaption><span class="t">Chart D3 (week of Oct 25, 2026). Who is being deported: more interior arrests, fewer convicts</span><p>The &#x27;worst of the worst&#x27; promise vs the data. Even with border crossings at historic lows, 69% of the ~980,000 deportations were of people stopped at or near the border. But the interior share is rising: 28% in 2025, 34% in H1 2026 and 39% in July 2026, with interior deportations up from about 8,000 a month (first three months) to 19,000 a month (May-July 2026). Only 31% of removals were of people with a criminal conviction, against a 44% average in FY2009-21; overall 20% (190,000) of all deportations had a conviction.</p><p>Sources: <a href="https://www.migrationpolicy.org/system/files/2026-10/mpi-deportations-fact-sheet-2026-final.pdf">MPI deportations fact sheet, Oct 2026 (PDF)</a> <a href="https://deportationdata.org/">Deportation Data Project (ICE FOIA data)</a></p></figcaption></figure></main></body></html>
