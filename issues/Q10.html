<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Deportation Graphs — Q10</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q10")</script></head><body><main id="issue"><h2 class="desk">Q10. Detention</h2><div class="wk">Weekly Focus graphs: new charts are added each week from primary data. Each caption names its sources; numbers are not copied from third-party chart images.</div><figure class="g w"><img src="img/W2026-11-01-D4.webp" alt="ICE detention hit a 2019-2026 high; 71% of detainees have no criminal conviction" loading="lazy"><figcaption><span class="t">Chart D4 (week of Nov 1, 2026). ICE detention hit a 2019-2026 high; 71% of detainees have no criminal conviction</span><p>People held in ICE detention by criminal status, from ICE&#x27;s biweekly statistics as compiled by TRAC (155 snapshots, May 2019 to Jul 11, 2026). Detention rose from 39,703 just before Jan 20, 2025 to a peak of 70,766 on Jan 25, 2026. On Jul 11, 2026, 19,329 of 65,765 (29%) had a criminal conviction; 20,247 had pending charges and 26,189 (40%) had neither.</p><ul><li>Before Jan 20 2025 (Jan 12 2025): convicted 10,494, pending 5,360, neither 23,849.</li><li>Latest (Jul 11 2026): convicted 19,329, pending 20,247, neither 26,189. The &#x27;pending charges&#x27; group grew about 3.8x, the fastest of the three.</li><li>Transparency gap: ICE&#x27;s last FY2026 detention spreadsheet is dated Jul 20, 2026; no newer figures had been posted as of Nov 1, 2026.</li></ul><p class="nt">Note: The administration&#x27;s case is that people arrested without convictions are still removable and that pending-charge detainees are criminal suspects. Critics point to the &#x27;neither&#x27; group as evidence that enforcement is not focused on criminals. The chart shows both readings: the convicted count has also risen, but more slowly than the total.</p><p>Sources: <a href="https://tracreports.org/immigration/quickfacts/detention.html">TRAC Immigration, detention quick facts (ICE data)</a> <a href="https://tracreports.org/phptools/immigration/detention/">TRAC detention data tool</a> <a href="https://www.ice.gov/doclib/detention/FY26_detentionStats07202026.xlsx">ICE Detention Statistics FY2026 (posted Jul 20 2026)</a> <a href="https://www.ice.gov/detain/detention-management">ICE Detention Management page</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-01-D5.webp" alt="Court-ordered releases from ICE detention rose 17-fold in FY2026" loading="lazy"><figcaption><span class="t">Chart D5 (week of Nov 1, 2026). Court-ordered releases from ICE detention rose 17-fold in FY2026</span><p>ICE final book-outs from detention by release reason, monthly, Oct 2024 to Jun 2026 (Jul 2026 is a partial month and is left out). Parole releases, about 5,000 a month in late 2024, fell to near zero from February 2025. In FY2026 ICE added a new &#x27;Court Ordered&#x27; category: 119 releases in Oct 2025, rising to 2,017 in May 2026, more than the 1,942 released on bond that month. FY2026 through Jul 20: 11,541 court-ordered releases.</p><ul><li>The great majority of book-outs are removals (&#x27;Release to Remove&#x27;): 27,679 in Jun 2026, against 1,853 court-ordered releases.</li><li>Court-ordered releases by criminality, FY2026 to Jul 20: 2,358 convicted, 2,327 pending charges, 6,856 neither.</li><li>FY2025 has no &#x27;Court Ordered&#x27; row, so earlier court releases may sit in other categories; the rise within FY2026 (Oct to May, about 17x) is the comparable signal.</li></ul><p class="nt">Note: Data stop at Jul 20, 2026, the last ICE spreadsheet. Whether court-ordered releases kept rising after July is unknown.</p><p>Sources: <a href="https://www.ice.gov/doclib/detention/FY26_detentionStats07202026.xlsx">ICE Detention Statistics FY2026 (posted Jul 20 2026)</a> <a href="https://www.ice.gov/doclib/detention/FY25_detentionStats09242025.xlsx">ICE Detention Statistics FY2025</a> <a href="https://www.ice.gov/detain/detention-management">ICE Detention Management page</a></p></figcaption></figure></main></body></html>
